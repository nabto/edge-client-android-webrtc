name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    env:
      ORG_GRADLE_PROJECT_GPG_SIGNING_KEY_BASE64:        ${{ secrets.ANDROID_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_GPG_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_PUBLIC_KEY }}
      ORG_GRADLE_PROJECT_GPG_SIGNING_PASSWORD:          ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_OSSRH_USERNAME:                ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      ORG_GRADLE_PROJECT_OSSRH_PASSWORD:                ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v3
      - name: Stage artifacts
        run: ./gradlew publish --no-daemon --stacktrace
      - name: Deploy to Maven Central
        run: ./gradlew jreleaserDeploy --no-daemon --stacktrace
      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: ignore
